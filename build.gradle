// ---------------------------------------------------------------------------
// Publishing to Maven Central, see "Publishing to Maven Central" in the README
// ---------------------------------------------------------------------------

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact tasks.named('javadocJar')

            artifactId = sdkArtifactId

            pom {
                // groovy-all 3.x has no jar, it is a pom-only artifact that aggregates the Groovy modules.
                // Gradle resolves that from its metadata, but Maven needs the type to not look for a jar.
                withXml {
                    asNode().dependencies.dependency.findAll { it.artifactId.text() == 'groovy-all' }.each {
                        it.appendNode('type', 'pom')
                    }
                }

                name = 'openEHR SDK'
                description = 'Java/Groovy SDK for openEHR: Operational Template (OPT) parsing, RM instance parsing, serialization and validation, and instance generation'
                url = 'https://github.com/CaboLabs/openEHR-SDK'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'ppazos'
                        name = 'Pablo Pazos'
                        organization = 'CaboLabs'
                        organizationUrl = 'https://cabolabs.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/CaboLabs/openEHR-SDK.git'
                    developerConnection = 'scm:git:ssh://git@github.com/CaboLabs/openEHR-SDK.git'
                    url = 'https://github.com/CaboLabs/openEHR-SDK'
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/CaboLabs/openEHR-SDK/issues'
                }
            }
        }
    }

    repositories {
        // local staging repository with the Maven layout, centralBundle zips it to upload it to the Central Portal
        maven {
            name = 'centralStaging'
            url = layout.buildDirectory.dir('central-staging')
        }
    }
}

// The key is read from the environment or gradle properties so it never gets in the repo:
//   ORG_GRADLE_PROJECT_signingKey (ASCII armored private key), ORG_GRADLE_PROJECT_signingPassword
// Signing is skipped when there is no key, so build/test/publishToMavenLocal work without it.
signing {
    required = false
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    if (signingKey)
    {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

// Zip with the layout the Central Portal expects (groupId/artifactId/version/*), upload it at
// https://central.sonatype.com/publishing or through its API.
tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Creates build/central-bundle/<artifactId>-<version>-bundle.zip to upload to Maven Central'

    dependsOn 'publishMavenJavaPublicationToCentralStagingRepository'
    from layout.buildDirectory.dir('central-staging')
    archiveFileName = "${sdkArtifactId}-${project.version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('central-bundle')
}
