plugins {
    // Apply the groovy plugin to add support for Groovy
    id 'groovy'

    // api configuration, so what the public API exposes gets compile scope in the published POM
    id 'java-library'

    id 'eclipse'

    // publishing to Maven Central
    id 'maven-publish'
    id 'signing'
}

// Maven coordinates: com.cabolabs:openehr-sdk:<version>, version is in gradle.properties
def sdkArtifactId = 'openehr-sdk'

java {
    // Maven Central requires the sources and javadoc jars
    withSourcesJar()
}

// javadoc doesn't process Groovy sources, so the javadoc jar is built from groovydoc
tasks.register('javadocJar', Jar) {
    dependsOn tasks.named('groovydoc')
    archiveClassifier = 'javadoc'
    from tasks.named('groovydoc').map { it.destinationDir }
}

repositories {
    // Use jcenter for resolving dependencies.
    // You can declare any Maven/Ivy/file repository here.
    //jcenter()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Use the latest Groovy version for building this library
    // api: the SDK classes are Groovy classes, consumers need Groovy to compile against them
    api 'org.codehaus.groovy:groovy-all:3.0.11'

    // picocli for CLI
    //implementation 'info.picocli:picocli:4.7.5'

    // Use the awesome Spock testing and specification framework
    //testImplementation 'org.spockframework:spock-core:1.3-groovy-2.5'
    testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'

    // https://mvnrepository.com/artifact/log4j/log4j
    //implementation group: 'log4j', name: 'log4j', version: '1.2.17'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.23.1'


    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core
    //implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.14.0'

    // https://mvnrepository.com/artifact/de.odysseus.staxon/staxon
    implementation group: 'de.odysseus.staxon', name: 'staxon', version: '1.3'


    // https://github.com/networknt/json-schema-validator
    implementation group: "com.networknt", name: "json-schema-validator", version: "1.0.73"

    implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '3.21.12'

    // to transform ADL to OPT
    implementation 'com.github.ppazos:java-libs:v1.0.20'
    // implementation 'com.github.ppazos.java-libs:adl-parser:v1.0.20'
    // implementation 'com.github.ppazos.java-libs:openehr-aom:v1.0.20'

    //implementation fileTree(dir: 'lib', include: ['*.jar'])

    // json serialization for tests that handles loops correctly
    testImplementation group: 'com.cedarsoftware', name: 'json-io', version: '4.13.0'
}

/* With this enabled it runs the Spock test cases and not the GroovyTestCases!
tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
*/

